name: Retrospective hardening sync

on:
  push:
    branches: [fix/session-retrospective-hardening]

permissions:
  contents: write

jobs:
  sync:
    if: "!startsWith(github.event.head_commit.message, 'build: sync retrospective hardening')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/session-retrospective-hardening
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - run: node scripts/build.mjs --sha=f2bb196350c6f8db406bfaff3321c2358fa04ed4
      - name: Verify complete OpenCode gates
        run: |
          npm run verify:dist
          npm run test:delivery
          npm run typecheck
          npm test
          npm run test:tui-render
          npm run test:distribution
          npm run validate:spec
          npm run test:release-metadata
          npm run test:package
      - name: Complete and archive OpenSpec change
        run: |
          node -e "const fs=require('node:fs'); const p='openspec/changes/session-retrospective-hardening/tasks.md'; let s=fs.readFileSync(p,'utf8'); s=s.replaceAll('- [ ] ','- [x] '); fs.writeFileSync(p,s)"
          npx openspec archive session-retrospective-hardening --yes
          npm run validate:spec
          npm run test:openspec-closure
      - name: Commit dist and archive
        run: |
          git add dist openspec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync retrospective hardening"
          git push origin HEAD:fix/session-retrospective-hardening
