name: Temporary diagnostics argument OpenSpec archiver

on:
  push:
    branches:
      - fix/diagnostics-endpoint-argument

permissions:
  contents: write

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[temp-archive-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/diagnostics-endpoint-argument
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Complete and archive OpenSpec change
        shell: bash
        run: |
          sed -i 's/^- \[ \]/- [x]/' openspec/changes/2026-09-30-fix-diagnostics-endpoint-argument/tasks.md
          npx openspec archive 2026-09-30-fix-diagnostics-endpoint-argument --yes
          npm run validate:spec
          npm run test:openspec-closure
      - name: Commit archived specs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec
          git commit -m "spec: archive diagnostics endpoint argument fix [temp-archive-done]"
          git push origin HEAD:fix/diagnostics-endpoint-argument
