name: Core compatibility

on:
  workflow_dispatch:
    inputs:
      core_sha:
        description: Complete litellm-discovery-core commit SHA
        required: true
        type: string
  repository_dispatch:
    types: [litellm-discovery-core-updated]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CORE_SHA: ${{ github.event.client_payload.core_sha || inputs.core_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Core selection
        shell: bash
        run: |
          [[ "$CORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - name: Verify against supplied Core SHA
        env:
          LITELLM_CORE_SHA: ${{ env.CORE_SHA }}
        run: |
          npm run typecheck
          npm test
          npm run test:delivery
          npm run test:tui-render
          npm run test:distribution
          npm run test:package
      - name: Publish Core provenance
        shell: bash
        run: |
          {
            echo "## Core compatibility"
            echo "- repository: https://github.com/rpchen/litellm-discovery-core.git"
            echo "- branch: main"
            echo "- commit: $CORE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"repository":"https://github.com/rpchen/litellm-discovery-core.git","branch":"main","sha":"%s"}\n' "$CORE_SHA" > core-compatibility-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-core-compatibility-provenance-${{ env.CORE_SHA }}
          path: core-compatibility-provenance.json
