name: v0.4.2 archive OpenSpec
on:
  push:
    branches: [fix/v0.4.2-real-opencode-e2e]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v0.4.2-real-opencode-e2e
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Close verified tasks and archive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs"
          const file = "openspec/changes/fix-v042-real-opencode-e2e/tasks.md"
          const text = readFileSync(file, "utf8")
          writeFileSync(file, text.replaceAll("- [ ]", "- [x]"))
          NODE
          npx openspec archive fix-v042-real-opencode-e2e --yes
          npm run validate:spec
          npm run test:openspec-closure
      - name: Commit archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec
          git diff --cached --quiet && exit 0
          git commit -m "spec(opencode): archive v0.4.2 real-host compatibility fix"
          git push
