name: v0.4.1 archive OpenSpec
on:
  push:
    branches: [fix/v0.4.1-multi-endpoint-runtime]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v0.4.1-multi-endpoint-runtime
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Complete verified tasks and archive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs"
          const file = "openspec/changes/fix-v041-multi-endpoint-runtime/tasks.md"
          const text = readFileSync(file, "utf8")
          writeFileSync(file, text.replaceAll("- [ ]", "- [x]"))
          NODE
          npx openspec archive fix-v041-multi-endpoint-runtime --yes
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs"
          const file = "openspec/specs/multi-endpoint-activation/spec.md"
          const text = readFileSync(file, "utf8")
          const purpose = "Defines how the OpenCode plugin exposes multiple globally configured LiteLLM endpoints as isolated integrations/providers, manages their independent credentials and activation state, and keeps diagnostics/UI behavior available without unsupported runtime child-plugin APIs."
          const next = text.replace(/## Purpose\n[\s\S]*?\n## Requirements/u, `## Purpose\n${purpose}\n\n## Requirements`)
          if (next === text) throw new Error("canonical multi-endpoint Purpose placeholder was not found")
          writeFileSync(file, next)
          NODE
          npm run validate:spec
          npm run test:openspec-closure
      - name: Commit archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec
          git diff --cached --quiet && exit 0
          git commit -m "spec(opencode): archive v0.4.1 runtime fix"
          git push
