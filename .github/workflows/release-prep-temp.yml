# One-use branch-only preparation; this file deletes itself before the release PR.
name: Release metadata preparation
on:
  push:
    branches: [chore/release-v0.2.0]
    paths: [.github/workflows/release-prep-temp.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Update release metadata without changing dependencies or tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = rpchen/opencode-litellm-provider
          test "$GITHUB_REF" = refs/heads/chore/release-v0.2.0
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, s) => fs.writeFileSync(p, s);
          const manifest = JSON.parse(read('package.json'));
          assert.equal(manifest.version, '0.1.4');
          assert.equal(manifest.scripts['test:delivery'], 'node --test scripts/check-core-delivery.mjs');
          manifest.version = '0.2.0';
          manifest.scripts['test:delivery'] = 'node --test scripts/check-core-delivery.mjs scripts/check-release-version.mjs';
          write('package.json', JSON.stringify(manifest, null, 2) + '\n');
          const lockText = read('package-lock.json');
          const lock = JSON.parse(lockText);
          assert.equal(lock.version, '0.1.2');
          assert.equal(lock.packages[''].version, '0.1.3');
          const updatedLock = lockText.replace(/^  "version": "0\.1\.2",$/m, '  "version": "0.2.0",').replace(/^      "version": "0\.1\.3",$/m, '      "version": "0.2.0",');
          lock.version = '0.2.0';
          lock.packages[''].version = '0.2.0';
          assert.deepEqual(JSON.parse(updatedLock), lock);
          write('package-lock.json', updatedLock);
          let readme = read('README.md');
          readme = readme.replaceAll('github:rpchen/opencode-litellm-provider#v0.1.4', 'github:rpchen/opencode-litellm-provider#v0.2.0');
          const heading = '### 锁定版本或回滚';
          assert.equal(readme.split(heading).length, 2);
          readme = readme.replace(heading, `### 已安装插件的升级\n\n先执行 \`opencode plugin list\`，以 \`SOURCE\` 列的完整来源为准；\`plugin check/update\` 不按 ID \`litellm\` 匹配。配置为 \`#v0.1.4\` 时，\`current\` 只表示该固定 tag 无变化，不代表已跟随 main。\n\n升级时编辑原有 plugins 条目，保留全部 options，将旧 tag 改为无后缀来源（跟随 main）或 \`#v0.2.0\`（固定本次发行）。不要另加第二条，也不要同时启用本地与 Git 两份插件。保存后重载，再用与新配置完全一致的来源执行更新：\n\n\`\`\`sh\nopencode reload\nopencode plugin check "github:rpchen/opencode-litellm-provider"\nopencode plugin update "github:rpchen/opencode-litellm-provider"\nopencode reload\nopencode plugin list\n\`\`\`\n\n以上命令用于无后缀来源；固定版本需将 check/update 参数替换为配置中的完整 tag 来源。Git 安装的 VERSION 列显示提交短 SHA，不能仅用 package.json 的版本号判断是否真正更新。\n\nv0.2.0 是共享 discovery core 迁移后的首个发行版；安装方式、宿主契约和配置保持兼容。发行说明、维护者实测范围与 core 溯源见 [v0.2.0](docs/releases/v0.2.0.md)。\n\n${heading}`);
          write('README.md', readme);
          write('docs/research/pr3-core-migration-validation.md', read('docs/research/pr3-core-migration-validation.md') + `\n## 后续维护者真实宿主反馈（2026-09-27）\n\nPR #19 合并后，维护者在 Windows / OpenCode 2.0.16 上从固定 v0.1.4 切换到无后缀 Git 来源，执行更新后提供 plugin list 输出：\n\n\`\`\`text\nID       VERSION  SOURCE\nlitellm  d565084  github:rpchen/opencode-litellm-provider\n\`\`\`\n\n随后维护者针对模型列表、推理档位、常用模型实际对话和 /litellm-audit-export 这些验收项明确反馈“已验证，正常”，并授权按 v0.2.0 发版。实测实现为 d565084c065e048cf53597f9ff9f529107d1a121，core 为 32575d4e0185ebf40fb54aa5b538a22acca4e0d3；合并后的 main CI run 36323934825 也已成功。\n\n这补充了前文实施时未执行真实宿主验证的历史记录；来源是维护者反馈，不是代理亲自操作宿主。没有提供逐模型/逐协议/全平台验证记录，不据此扩大验收范围；没有收集真实服务地址、Key 或私人绝对路径。v0.2.0 准备只更新版本、发行门禁与文档，保留上述源码、dist 和 provenance，不重新取得 core/main。\n`);
          write('docs/decisions.md', read('docs/decisions.md') + `\n## v0.2.0 发行决策（2026-09-27）\n\n维护者在 Windows / OpenCode 2.0.16 上实测 d565084 正常后，明确授权“发版 PR → CI → 合并 → main CI → tag → GitHub Release”。v0.2.0 标记共享 core 迁移的阶段性发行，不表示引入破坏性行为，也不要求与 Pi 版本同步。历史 v0.1.4 不移动、不覆盖；不发布 npm。\n\n发行沿用已实测实现、完整 dist 和 core provenance 32575d4e0185ebf40fb54aa5b538a22acca4e0d3，不执行更新构建。manifest 与锁文件两处根版本统一为 0.2.0，不更新依赖解析。Release 检查既有版本 tag 与三个版本字段一致；显式 dispatch 也不得选择 branch。附件上传后下载复核校验和、归档字节及解包 dist。所有验证仅在执行后记为通过，维护者实测与自动化替身测试分别说明。Pi 与 core 仓库保持不变。\n`);
          write('CONTRIBUTING.md', read('CONTRIBUTING.md') + `\n### 发行版本与显式重试\n\n发行准备经 PR 同步 package.json、package-lock.json 顶层和 packages[""] 的 version，不重新解析无关依赖。\`test:delivery\` 同时覆盖发行 ref/版本正负向检查。已有版本 tag 可显式 dispatch Release workflow；必须选择 tag，选择 main 或其他分支会失败，且不会自行创建 tag。该入口与 tag push 使用相同固定 provenance 门禁，不是跳过测试的捷径。\n\n可在 docs/releases/vX.Y.Z.md 维护发行说明，workflow 会将其与自动变更记录一起发布。上传后 workflow 下载附件核验 SHA-256、打包字节和解包 dist。不要移动旧 tag、覆盖已经发布的不同内容，或把旧提交/维护者单机反馈扩大成新提交/全平台测试证据。\n`);
          NODE
          node --test scripts/check-release-version.mjs
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME=v0.2.0 node scripts/release-version.mjs
          git diff --exit-code d565084c065e048cf53597f9ff9f529107d1a121 -- src dist test/fixtures test/__snapshots__
          test "$(git diff --numstat -- package-lock.json)" = "$(printf '2\t2\tpackage-lock.json')"
          rm .github/workflows/release-prep-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md CONTRIBUTING.md docs/decisions.md docs/research/pr3-core-migration-validation.md .github/workflows/release-prep-temp.yml
          git commit -m 'chore: prepare v0.2.0 metadata and record maintainer acceptance'
          git push origin HEAD:refs/heads/chore/release-v0.2.0
