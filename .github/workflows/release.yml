name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node --print 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Render TUI card and exercise mouse actions
        run: bun run test:tui-render

      - name: Build clean distribution
        run: bun run build:dist

      - name: Verify committed distribution
        shell: bash
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"

      - name: Validate OpenSpec
        run: npm run validate:spec

      - name: Test package without lifecycle scripts
        run: bun run test:package

      - name: Test tagged Git package
        shell: bash
        env:
          PACKAGE_SPEC: github:${{ github.repository }}#${{ github.ref_name }}
        run: |
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "$PACKAGE_SPEC"
          node --input-type=module --eval '
            const plugin = await import("opencode-litellm-provider")
            if (plugin.PLUGIN_ID !== "litellm" || !plugin.default) {
              throw new Error("tagged Git package exports are invalid")
            }
          '

      - name: Pack release artifacts
        id: pack
        shell: bash
        run: |
          mkdir release
          tarball="$(npm pack --pack-destination release)"
          checksum="$tarball.sha256"
          (cd release && sha256sum "$tarball" > "$checksum")
          echo "tarball=release/$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=release/$checksum" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            Install the latest stable branch:
            `opencode plugin add github:rpchen/opencode-litellm-provider`

            Install this fixed version:
            `opencode plugin add github:rpchen/opencode-litellm-provider#${{ github.ref_name }}`
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.checksum }}
