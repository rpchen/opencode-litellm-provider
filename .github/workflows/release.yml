name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node --print 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          }

      - name: Install locked dependencies
        run: npm ci

      # A tag reproduces its recorded core SHA, never a newer core/main.
      - name: Verify untouched tagged distribution at its provenance SHA
        run: npm run verify:dist

      - name: Test cache integrity and immutable verification
        run: npm run test:delivery

      - name: Typecheck at the committed core SHA
        run: npm run typecheck

      - name: Run all unit tests at the committed core SHA
        run: npm test

      - name: Render TUI card and exercise mouse actions
        run: npm run test:tui-render

      - name: Build in a clean external workspace and reject altered distributions
        run: npm run test:distribution

      - name: Validate OpenSpec
        run: npm run validate:spec

      - name: Install and initialize the delivered tarball without lifecycle scripts
        run: npm run test:package

      - name: Install and initialize the tagged Git package
        env:
          PACKAGE_SPEC: github:${{ github.repository }}#${{ github.ref_name }}
        run: npm run test:package

      - name: Ensure verification did not replace the tagged delivery
        shell: bash
        run: |
          git diff --exit-code -- dist test/fixtures test/__snapshots__
          test -z "$(git ls-files --others --exclude-standard -- dist)"
          test -z "$(git ls-files -- src/core src/generated/discovery-core)"

      - name: Pack release artifacts
        id: pack
        shell: bash
        run: |
          mkdir release
          tarball="$(npm pack --ignore-scripts --pack-destination release)"
          checksum="$tarball.sha256"
          (cd release && sha256sum "$tarball" > "$checksum")
          echo "tarball=release/$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=release/$checksum" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            Install the latest stable branch:
            `opencode plugin add github:rpchen/opencode-litellm-provider`

            Install this fixed version:
            `opencode plugin add github:rpchen/opencode-litellm-provider#${{ github.ref_name }}`
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.checksum }}
