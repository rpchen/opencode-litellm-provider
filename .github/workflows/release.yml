name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Explicit dispatch must select an existing version tag, never main.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Release closure verification derives archived requirement chronology
          # from Git ancestry and therefore requires complete repository history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Verify version tag and manifest/lockfile versions
        run: node scripts/release-version.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release metadata consistency
        run: npm run test:release-metadata

      - name: Reject completed active OpenSpec changes
        run: npm run test:openspec-closure

      # A tag reproduces its recorded core SHA, never a newer core/main.
      - name: Verify untouched tagged distribution at its provenance SHA
        run: npm run verify:dist

      - name: Test cache integrity and immutable verification
        run: npm run test:delivery

      - name: Typecheck at the committed core SHA
        run: npm run typecheck

      - name: Run all unit tests at the committed core SHA
        run: npm test

      - name: Render TUI card and exercise mouse actions
        run: npm run test:tui-render

      - name: Build in a clean external workspace and reject altered distributions
        run: npm run test:distribution

      - name: Validate OpenSpec
        run: npm run validate:spec

      - name: Enforce 100% specification scenario coverage
        run: npm run test:scenario-coverage

      - name: Install and initialize the delivered tarball without lifecycle scripts
        run: npm run test:package

      - name: Install and initialize the tagged Git package
        env:
          PACKAGE_SPEC: github:${{ github.repository }}#${{ github.ref_name }}
        run: npm run test:package

      - name: Ensure verification did not replace the tagged delivery
        shell: bash
        run: |
          git diff --exit-code -- dist test/fixtures test/__snapshots__
          test -z "$(git ls-files --others --exclude-standard -- dist)"
          test -z "$(git ls-files -- src/core src/generated/discovery-core)"

      - name: Test release index boundaries
        run: npm run test:codebase-memory

      - name: Install pinned codebase-memory runtime
        run: npm install --global codebase-memory-mcp@0.11.0

      - name: Generate codebase-memory snapshot for the exact release tag
        run: node scripts/codebase-memory.mjs build "$GITHUB_REF_NAME"

      - name: Pack release artifacts
        id: pack
        shell: bash
        run: |
          mkdir release
          tarball="$(npm pack --ignore-scripts --pack-destination release)"
          checksum="$tarball.sha256"
          (cd release && sha256sum "$tarball" > "$checksum")
          echo "tarball=release/$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=release/$checksum" >> "$GITHUB_OUTPUT"
          notes="$RUNNER_TEMP/release-notes.md"
          if test -f "docs/releases/$GITHUB_REF_NAME.md"; then
            cp "docs/releases/$GITHUB_REF_NAME.md" "$notes"
          else
            printf 'Install the latest stable branch:\n`opencode plugin add github:rpchen/opencode-litellm-provider`\n\nInstall this fixed version:\n`opencode plugin add github:rpchen/opencode-litellm-provider#%s`\n' "$GITHUB_REF_NAME" > "$notes"
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body_path: ${{ steps.pack.outputs.notes }}
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.checksum }}
            .tmp/codebase-memory-release/codebase-memory.graph.db.zst
            .tmp/codebase-memory-release/codebase-memory.artifact.json
            .tmp/codebase-memory-release/codebase-memory.release.json

      - name: Download and verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          CHECKSUM: ${{ steps.pack.outputs.checksum }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/verified-release-assets"
          mkdir -p "$destination/unpacked"
          archive="$(basename "$TARBALL")"
          checksum="$(basename "$CHECKSUM")"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$destination" --pattern "$archive" --pattern "$checksum"
          (cd "$destination" && sha256sum --check "$checksum")
          cmp "$TARBALL" "$destination/$archive"
          cmp "$CHECKSUM" "$destination/$checksum"
          tar -xzf "$destination/$archive" -C "$destination/unpacked"
          diff --no-dereference -r dist "$destination/unpacked/package/dist"
          echo "Published assets verified: $GITHUB_REF_NAME at $GITHUB_SHA"
          cat "$destination/$checksum"
          {
            echo "## Verified release: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo '```text'
            cat "$destination/$checksum"
            echo '```'
            echo 'Downloaded archive, checksum, and extracted dist match the verified candidate.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify published codebase-memory snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/codebase-memory.mjs sync "$GITHUB_REF_NAME"
