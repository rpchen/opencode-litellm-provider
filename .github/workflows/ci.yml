name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build clean distribution
        run: bun run build

      - name: Verify committed distribution
        shell: bash
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"

      - name: Validate OpenSpec
        run: npm run validate:spec

      - name: Test package without lifecycle scripts
        run: bun run test:package

      - name: Test remote Git package
        if: github.event_name == 'push'
        shell: bash
        env:
          PACKAGE_SPEC: github:${{ github.repository }}#${{ github.sha }}
        run: |
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "$PACKAGE_SPEC"
          node --input-type=module --eval '
            const plugin = await import("opencode-litellm-provider")
            if (plugin.PLUGIN_ID !== "litellm" || !plugin.default) {
              throw new Error("remote Git package exports are invalid")
            }
          '
