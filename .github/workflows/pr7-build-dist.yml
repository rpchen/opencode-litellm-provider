name: PR7 Build Dist
# retry after TUI compatibility fix

on:
  push:
    branches: [feat/pr7-diagnostics]
    paths: [.github/workflows/pr7-build-dist.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/pr7-diagnostics
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - run: npm run build:dist
      - name: Commit generated distribution and remove one-shot workflow
        shell: bash
        run: |
          test "$(node -p "require('./dist/core-provenance.json').sha")" = "f1faf87fb7e2436358b190dd9b6fabd09b511c1f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git rm .github/workflows/pr7-build-dist.yml
          git commit -m "build: compile PR7 diagnostics with merged core"
          git push origin HEAD:feat/pr7-diagnostics
