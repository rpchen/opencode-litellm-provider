name: Temporary diagnostics argument fixed-dist builder

on:
  push:
    branches:
      - fix/diagnostics-endpoint-argument

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[temp-build-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/diagnostics-endpoint-argument
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - run: npm run build:fixed
      - name: Commit fixed distribution if changed
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist already matches fixed build"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: refresh diagnostics argument dist [temp-build-done]"
          git push origin HEAD:fix/diagnostics-endpoint-argument
