name: PR8 dist sync

on:
  push:
    branches: [feat/pr8-discovery-quality]

permissions:
  contents: write

jobs:
  build:
    if: "!startsWith(github.event.head_commit.message, 'build: sync PR8 dist')"
    runs-on: ubuntu-latest
    env:
      LITELLM_CORE_SHA: ef20bb92c778bf27afb7a8ceca84e944143ed667
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/pr8-discovery-quality
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - run: npm run build:dist
      - name: Commit generated distribution
        shell: bash
        run: |
          git add dist
          if git diff --cached --quiet; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync PR8 dist"
          git push origin HEAD:feat/pr8-discovery-quality
