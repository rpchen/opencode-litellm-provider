name: Operational limit guard dist sync

on:
  push:
    branches: [fix/operational-limit-guard]

permissions:
  contents: write

jobs:
  sync:
    if: "!startsWith(github.event.head_commit.message, 'build: sync operational limit guard dist')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LITELLM_CORE_SHA: e5f6393c12fc199bd8466e9d01dd5914ad6b74d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/operational-limit-guard
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - run: npm run build:dist
      - name: Verify complete delivery gates
        run: |
          npm run verify:dist
          npm run test:delivery
          npm run typecheck
          npm test
          npm run test:tui-render
          npm run test:distribution
          npm run test:package
          npm run validate:spec
      - name: Close and archive OpenSpec change
        run: |
          node -e "const fs=require('node:fs'); const p='openspec/changes/operational-limit-publication-guard/tasks.md'; let s=fs.readFileSync(p,'utf8'); s=s.replaceAll('- [ ] ','- [x] '); fs.writeFileSync(p,s)"
          npx openspec archive operational-limit-publication-guard --yes
          npm run validate:spec
      - name: Commit generated distribution and archive
        run: |
          git add dist openspec
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync operational limit guard dist"
          git push origin HEAD:fix/operational-limit-guard
