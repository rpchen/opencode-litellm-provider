name: Temporary endpoint recovery OpenSpec archiver

on:
  push:
    branches:
      - fix/endpoint-tui-interaction-e2e

permissions:
  contents: write

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[skip archive]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/endpoint-tui-interaction-e2e
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Complete and archive OpenSpec change
        shell: bash
        run: |
          sed -i 's/^- \[ \]/- [x]/' openspec/changes/2026-09-29-fix-endpoint-tui-interaction-recovery/tasks.md
          npx openspec archive 2026-09-29-fix-endpoint-tui-interaction-recovery --yes
          npm run validate:spec
          npm run test:openspec-closure
      - name: Commit archived specs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec
          git commit -m "spec: archive endpoint TUI interaction recovery [skip archive]"
          git push origin HEAD:fix/endpoint-tui-interaction-e2e
