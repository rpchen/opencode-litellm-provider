name: PR6 branch build

on:
  push:
    branches: [feat/pr6-persisted-snapshot]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/pr6-persisted-snapshot
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - run: node scripts/build.mjs --sha=2dbad04165f1ea0e60a83dee7c06e740aa8eb1d9
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:spec
      - name: Commit generated distribution
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: rebuild dist for PR6"
          git push origin HEAD:feat/pr6-persisted-snapshot
