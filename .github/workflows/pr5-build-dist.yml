name: PR5 build dist artifact

on:
  push:
    branches:
      - feat/pr5-refresh-coordinator

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - run: npm run build:dist
      - name: Commit generated dist when changed
        shell: bash
        run: |
          if git diff --quiet -- dist && test -z "$(git ls-files --others --exclude-standard -- dist)"; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: refresh OpenCode PR5 distribution"
          git push origin HEAD:feat/pr5-refresh-coordinator
