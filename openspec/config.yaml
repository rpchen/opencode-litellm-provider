schema: spec-driven

# Project context — shown to AI when creating artifacts for EVERY change.
context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  项目：opencode-litellm-provider —— 通过公开 GitHub Git package 分发的 OpenCode v2 插件，不发布 npm。
  用户只填 LiteLLM 地址 + API Key，即自动发现并注册 provider / 协议 / 模型 / 能力 / 推理档位。
  业务基线遵循已批准 restore-model-metadata-priority：LiteLLM 提供 model_name 发现入口，
  Core 按官方 → OpenCode → OpenRouter 选一条 models.dev 记录提供完整能力；价格可缺失或0，不截断限制、不影响发布/LKG。
  不要求 serving proof 或 models_dev_provider；支持推理与可选档位分别处理；禁止读取 Codex models_cache.json。

  宿主无关的发现、协议、元数据与指纹仅在 rpchen/litellm-discovery-core 维护，经公共入口消费。
  src/generated/discovery-core 和 src/core 是构建生成、Git 忽略的源码/转接，不手工维护或提交。
  Protocol 来自共享入口；OpenCode ModelSpec.package 和 SDK 映射留在 src/host。
  HTTP、轮询、缓存、凭据、宿主注册、命令与审计仍是本仓库职责。

  Tech stack: TypeScript ESM + tsc；npm ci 锁定依赖，Bun 运行测试。
  目标宿主：OpenCode >=2.0.15 <2.1；沿用 package.json 的 @opencode/plugin peer 和 TUI 依赖。
  宿主 SDK 不编入 core，参考 docs/research/opencode-v2-plugin-api.md 中的版本与来源。
  仓库：https://github.com/rpchen/opencode-litellm-provider；独立 Git 仓库，不要求任何平级目录。

  build:dist 显式解析当时 core/main 的完整 SHA，在一次构建中固定类型检查、测试和编译输入。
  dist 和 dist/core-provenance.json 必须提交；安装和运行不得下载 core 或依赖生命周期脚本。
  verify:dist 读取候选 provenance，在独立目录重建后比较原 dist；不先覆盖候选、不回退最新 main。
  core 更新不改变已发布插件；下一次更新构建才包含新 core。本次不做跨仓库自动触发。

rules:
  proposal:
    - 必须写明对 OpenCode v2 插件 API 的依赖面（用到哪些 ctx 域 / hook），以及 experimental 接口风险
  design:
    - 与现有主规格和固定 fixtures 行为基线的任何差异必须列表说明（差异 → 理由）
    - 涉及网络发现的设计必须说明失败降级、缓存策略和刷新触发方式
    - 涉及构建交付必须区分更新构建与固定复验，说明缓存真实性和安装隔离边界
  tasks:
    - 每个变更必须包含针对 LiteLLM /v1/model/info 固定样本（test/fixtures）的单元测试任务
    - 涉及宿主集成必须评估真实 OpenCode v2 手动加载条件；具备条件时执行，未执行须明确原因，不以替身测试冒充

operations:
  apply:
    guidance:
      - 密钥、真实服务地址及用户本机路径不得写入源码、测试 fixtures、构建 provenance 或日志
      - 保留已有未提交修改，不自动清理或提交用户工作；遵守 AGENTS 的真实验证凭据约定
      - 提交使用 conventional commits，完成后同步主规格并归档，逐项如实记录验证结果
